spring.application.name=marketreply-ai

# ---- MongoDB Atlas ----
# Replace <user>, <password>, <cluster-url> and database name with your Atlas values.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/marketreply}

# ---- Gemini ----
gemini.api-key=${GEMINI_API_KEY:your-gemini-api-key-here}
gemini.model=gemini-2.5-flash
gemini.base-url=https://generativelanguage.googleapis.com/v1beta

# Fallback model used automatically if the main model is overloaded (503/429)
gemini.fallback-model=gemini-2.5-flash-lite
# Generous output budget so the JSON can never be cut off mid-way
gemini.max-output-tokens=4096
# Per-request timeout (seconds) and extra retries per model
gemini.timeout-seconds=15
gemini.max-retries=1

# ---- JWT (login/register auth) ----
# IMPORTANT: override jwt.secret via the JWT_SECRET env var in any shared/production deployment.
jwt.secret=${JWT_SECRET:change-this-default-dev-only-secret-key-please-32chars-min}
jwt.expiration-ms=604800000

# ---- Server ----
# Render assigns a port via the PORT env var and scans for it directly -
# hardcoding 8080 here causes "Port scan timeout" deploy failures on Render.
server.port=${PORT:8080}

# ---- Optional API key gate (see security/ApiKeyFilter.java) ----
security.api-key.enabled=false
security.api-key.value=
security.api-key.header=X-API-KEY

# ---- Swagger ----
springdoc.swagger-ui.path=/swagger-ui.html

# Active profile - defaults to dev locally; override with SPRING_PROFILES_ACTIVE=prod on Render
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
# Product photos are resized in the browser; allow a little headroom
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# Set SEED_DEMO_DATA=true to add sample sellers and products on startup (safe to leave on: it never duplicates)
app.seed-demo-data=${SEED_DEMO_DATA:false}
